name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .

  mypy:
    name: Mypy Type-Check (engine/* only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install mypy==1.11.2
      - name: Mypy on engine/
        run: mypy engine/

  test:
    name: Unit Tests (pytest, alle Testdateien)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Refactor Phase 0: Runner-Migration von "python3 tests/test_cinematic_e2e.py"
      # (nur eine Datei) auf pytest (beide Testdateien, 242 Funktionen). Die App selbst
      # bleibt Zero-Framework -- nur der Test-Runner braucht pytest, siehe
      # requirements-dev.txt (dort mit ruff/mypy identisch gepinnt).
      - name: Install pytest
        run: pip install pytest==8.3.3
      - name: Run unit tests
        run: python3 -m pytest
        env:
          # Tests laufen ohne externe API-Keys
          KIE_KEY_FILE: /dev/null
          ELEVENLABS_KEY_FILE: /dev/null
